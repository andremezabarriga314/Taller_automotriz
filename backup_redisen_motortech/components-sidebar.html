{% load static %}

<aside class="sidebar" id="sidebar">
    <a class="brand" href="{% url 'dashboard' %}">
        <span class="brand-icon">M</span>
        <span>
            <strong>MOTORTECH</strong>
            <small>SERVICE CENTER</small>
        </span>
    </a>

    <div class="menu-label">PRINCIPAL</div>

    <a class="nav-link {% if request.path == '/' %}active{% endif %}"
       href="{% url 'dashboard' %}">
        <span>◫</span> Dashboard
    </a>

    <div class="menu-label">GESTIÓN DEL TALLER</div>

    <a class="nav-link {% if '/clientes/' in request.path %}active{% endif %}"
       href="{% url 'crud_list' 'clientes' %}">
        <span>♙</span> Clientes
    </a>

    <a class="nav-link {% if '/vehiculos/' in request.path %}active{% endif %}"
       href="{% url 'crud_list' 'vehiculos' %}">
        <span>▣</span> Vehículos
    </a>

    <a class="nav-link {% if '/citas/' in request.path %}active{% endif %}"
       href="{% url 'crud_list' 'citas' %}">
        <span>▦</span> Citas
    </a>

    <a class="nav-link {% if '/diagnosticos/' in request.path %}active{% endif %}"
       href="{% url 'crud_list' 'diagnosticos' %}">
        <span>⌕</span> Diagnósticos
    </a>

    <a class="nav-link {% if '/ordenes/' in request.path %}active{% endif %}"
       href="{% url 'crud_list' 'ordenes' %}">
        <span>▤</span> Órdenes de servicio
    </a>

    <a class="nav-link {% if '/detalles/' in request.path %}active{% endif %}"
       href="{% url 'crud_list' 'detalles' %}">
        <span>▧</span> Detalles de órdenes
    </a>

    <a class="nav-link {% if '/repuestos/' in request.path %}active{% endif %}"
       href="{% url 'crud_list' 'repuestos' %}">
        <span>⚙</span> Repuestos
    </a>

    <div class="menu-label">ANÁLISIS</div>

    <a class="nav-link {% if '/modulo/reportes/' in request.path %}active{% endif %}"
       href="{% url 'modulo' 'reportes' %}">
        <span>▥</span> Reportes
    </a>

    <div class="sidebar-bottom">
        <div class="system-status">
            <span></span> Sistema operativo
        </div>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="logout-button" type="submit">
                ↪ Cerrar sesión
            </button>
        </form>
    </div>
</aside>
